<!-- CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ticketmaster-venue-widget@1/dist/ticketmaster-venue-widget.min.css">

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/ticketmaster-venue-widget@1/dist/ticketmaster-venue-widget.min.js"></script>

<script>
  VenueEvents.init({
    apiKey: 'placeholder', // Required by widget v1.0.x — ignored when proxyUrl is set
    proxyUrl: 'https://16oc-events-proxy.<YOUR_SUBDOMAIN>.workers.dev',
    venues: 'rZ7HnEZ17aJq7,rZ7HnEZ17aJq0,KovZpZAktlaA',
    theme: {
      primaryColor: '#5d071b'
    },
    tracking: {
      utmSource: 'thaliahall-website',
      utmMedium: 'widget',
      utmCampaign: 'events'
    }
  });
</script>
