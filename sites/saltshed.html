<script>

    venues: 'KovZ917AI5F,KovZ917Amf0,rZ7HnEZ17_Skd',
    subVenues: {
      'KovZ917Amf0': 'Fairgrounds',
      'rZ7HnEZ17_Skd': 'Three Top Lounge'

    theme: {
      primaryColor: '#2d3b97'
    },
    tracking: {
      utmSource: 'saltshed-website',
      utmMedium: 'widget',
      utmCampaign: 'events'
    }
  });
</script>
